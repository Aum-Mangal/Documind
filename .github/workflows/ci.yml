name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest

  frontend:
    name: Frontend lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

  migrations:
    name: Database migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_USER: documind
          POSTGRES_PASSWORD: documind
          POSTGRES_DB: documind
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U documind"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      PGPASSWORD: documind
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fresh database - upgrade, check for drift, downgrade, upgrade again
        env:
          DATABASE_URL: postgresql://documind:documind@localhost:5432/documind
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head

      - name: Existing database from the old create_all() code upgrades in place
        env:
          DATABASE_URL: postgresql://documind:documind@localhost:5432/legacy
        run: |
          psql -h localhost -U documind -d documind -c "CREATE DATABASE legacy"
          # Schema and data exactly as the pre-Alembic app created them (e.g. the Supabase database)
          psql -h localhost -U documind -d legacy -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE users (id SERIAL PRIMARY KEY, email VARCHAR NOT NULL, password VARCHAR NOT NULL,
                              created_at TIMESTAMP WITH TIME ZONE DEFAULT now());
          CREATE UNIQUE INDEX ix_users_email ON users (email);
          CREATE INDEX ix_users_id ON users (id);
          CREATE TABLE documents (id SERIAL PRIMARY KEY, user_id INTEGER NOT NULL REFERENCES users (id),
                                  filename VARCHAR NOT NULL, raw_text TEXT, summary TEXT,
                                  created_at TIMESTAMP WITH TIME ZONE DEFAULT now());
          CREATE INDEX ix_documents_id ON documents (id);
          INSERT INTO users (email, password) VALUES ('legacy@documind.dev', '$2b$12$abcdefghijklmnopqrstuv');
          INSERT INTO documents (user_id, filename, raw_text) VALUES (1, 'old.pdf', 'kept text');
          SQL
          alembic upgrade head
          alembic check
          # Data survived, and deleting a user now cascades to their documents
          psql -h localhost -U documind -d legacy -v ON_ERROR_STOP=1 -tAc \
            "SELECT count(*) FROM documents WHERE raw_text = 'kept text'" | grep -qx 1
          psql -h localhost -U documind -d legacy -v ON_ERROR_STOP=1 -c "DELETE FROM users WHERE id = 1"
          psql -h localhost -U documind -d legacy -v ON_ERROR_STOP=1 -tAc \
            "SELECT count(*) FROM documents" | grep -qx 0
          psql -h localhost -U documind -d legacy -v ON_ERROR_STOP=1 -tAc \
            "SELECT count(*) FROM pg_extension WHERE extname = 'vector'" | grep -qx 1

  stack:
    name: Docker stack smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Create a throwaway backend/.env
        run: |
          echo "SECRET_KEY=$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')" > backend/.env
          grep -q '^SECRET_KEY=.\{32,\}' backend/.env

      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 300

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Smoke test
        run: |
          pip install PyJWT==2.10.1
          python scripts/smoke_test.py --base http://127.0.0.1:8000 \
            --secret-key "$(sed -n 's/^SECRET_KEY=//p' backend/.env)"

      - name: Service logs
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Stop the stack
        if: always()
        run: docker compose down -v
