name: Deploy API to Hugging Face Spaces

# Runs after CI passes on main (or by hand). Does nothing until the HF_SPACE variable is set.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-space
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.HF_SPACE != '' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment:
      name: huggingface
      url: https://huggingface.co/spaces/${{ vars.HF_SPACE }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Sync the Space's settings and secrets from GitHub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
          # Secrets (encrypted on Hugging Face; empty ones are skipped)
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          # Plain settings
          CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
        run: |
          pip install --quiet huggingface_hub==1.21.0
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          space = os.environ["HF_SPACE"]
          secrets = ["SECRET_KEY", "DATABASE_URL", "MIGRATION_DATABASE_URL", "REDIS_URL", "S3_ENDPOINT_URL",
                     "S3_ACCESS_KEY_ID", "S3_SECRET_ACCESS_KEY", "GROQ_API_KEY", "SENTRY_DSN"]
          variables = {
              "ENVIRONMENT": "production",
              "LOG_FORMAT": "json",
              "TRUST_PROXY_HEADERS": "true",  # the Space sits behind Hugging Face's proxy
              "DB_PGBOUNCER": "true",         # DATABASE_URL is Neon's pooled endpoint
              "DB_NULL_POOL": "true",         # let Neon scale to zero between requests
              "S3_BUCKET": "documind",
              "S3_REGION": "auto",
              "CORS_ORIGINS": os.environ.get("CORS_ORIGINS", ""),
          }
          missing = [name for name in ("SECRET_KEY", "DATABASE_URL", "GROQ_API_KEY") if not os.environ.get(name)]
          if missing:
              raise SystemExit(f"Missing required GitHub secrets: {', '.join(missing)}")
          for name in secrets:
              if os.environ.get(name):
                  api.add_space_secret(space, name, os.environ[name])
          for name, value in variables.items():
              if value:
                  api.add_space_variable(space, name, value)
          print(f"Synced settings for {space}")
          PY

      - name: Push the app to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          mkdir -p /tmp/space
          # Only what the image needs: the Space builds it from the Dockerfile
          rsync -a Dockerfile /tmp/space/
          rsync -a --exclude node_modules --exclude dist frontend /tmp/space/
          rsync -a --exclude venv --exclude data --exclude tests --exclude 'eval/results' --exclude '__pycache__' backend /tmp/space/
          cp deploy/huggingface/README.md /tmp/space/README.md
          cd /tmp/space
          git init -q -b main
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7} from GitHub"
          git push --force -q "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main

      - name: Wait for the new version to be healthy
        env:
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          host="$(echo "$HF_SPACE" | tr '/' '-' | tr '[:upper:]' '[:lower:]').hf.space"
          # The Space rebuilds the image first; give it up to 20 minutes
          for i in $(seq 1 80); do
            if curl -fsS --max-time 10 "https://$host/api/health/ready" >/dev/null; then
              echo "Healthy: https://$host"
              exit 0
            fi
            sleep 15
          done
          echo "The Space did not become healthy in time; check its build logs on Hugging Face."
          exit 1
