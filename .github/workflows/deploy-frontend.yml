name: Deploy frontend to GitHub Pages

# Builds the frontend against the deployed API. Does nothing until the API_URL variable is
# set (e.g. https://<owner>-<space>.hf.space); the Space must allow this origin in CORS_ORIGINS.
on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/deploy-frontend.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: vars.API_URL != ''
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Build
        env:
          VITE_API_URL: ${{ vars.API_URL }}
          # Pages serves the site from /<repository>/
          VITE_BASE: /${{ github.event.repository.name }}/
        run: |
          npm run build
          # Any unknown path falls back to the app
          cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - id: deployment
        uses: actions/deploy-pages@v4
