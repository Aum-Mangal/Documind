name: Keep the Space awake (optional)

# A free Space sleeps after 48 hours without visitors; the next visitor waits for it to start.
# This pings it twice a day. Off unless the KEEPALIVE variable is "true"; check that this
# fits Hugging Face's current terms before enabling it.
on:
  schedule:
    - cron: "23 */12 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    if: vars.KEEPALIVE == 'true' && vars.HF_SPACE != ''
    runs-on: ubuntu-latest
    steps:
      - name: Ping
        env:
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          host="$(echo "$HF_SPACE" | tr '/' '-' | tr '[:upper:]' '[:lower:]').hf.space"
          for i in 1 2 3 4 5 6; do
            curl -fsS --max-time 30 "https://$host/api/health" && exit 0
            sleep 30
          done
          exit 1
