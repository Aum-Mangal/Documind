# DocuMind on your computer: Postgres + pgvector, Redis, S3-compatible storage, and the app.
#
#   docker compose up --build          # everything; open http://localhost:8000
#   docker compose up db redis s3      # only the services, when running the API with uvicorn
#
# Optional settings (GROQ_API_KEY for AI answers, limits, ...) are read from backend/.env.
# A SECRET_KEY is generated on first start if none is set. The service URLs below override
# whatever backend/.env says, so the app always uses these local services.

services:
  db:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_USER: documind
      POSTGRES_PASSWORD: documind
      POSTGRES_DB: documind
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U documind -d documind"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4.12-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # SeaweedFS speaks the S3 API, standing in for Cloudflare R2 locally
  s3:
    image: chrislusf/seaweedfs:4.51
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json"]
    ports:
      - "8333:8333"
    volumes:
      - s3data:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  api:
    build: .
    env_file:
      - path: backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql://documind:documind@db:5432/documind
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://s3:8333
      S3_ACCESS_KEY_ID: documind
      S3_SECRET_ACCESS_KEY: documind-local-secret
      S3_BUCKET: documind
      S3_REGION: us-east-1
      PORT: "10000"
      # Local development signs up test accounts often; production keeps the default of 5 an hour
      SIGNUP_PER_HOUR: "100"
    ports:
      - "8000:10000"
    volumes:
      - appstate:/app/state
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3:
        condition: service_started

volumes:
  appstate:
  pgdata:
  redisdata:
  s3data:
